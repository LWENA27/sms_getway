# Netlify configuration for Flutter Web App
# SMS Gateway Pro - Web Admin Panel
#
# IMPORTANT: Build is handled by GitHub Actions (.github/workflows/deploy-netlify.yml)
# Disable Netlify's automatic builds in site settings:
# Site Settings > Build & Deploy > Build Settings > Stop builds

[build]
  # This should never run - GitHub Actions deploys directly via API
  command = "exit 0"
  publish = "build/web"

# Disable automatic builds from Git
[build.ignore]
  # Always ignore - GitHub Actions handles deployment
  command = "exit 0"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
