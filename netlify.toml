# Netlify configuration for Flutter Web App
# SMS Gateway Pro - Web Admin Panel
#
# NOTE: This project uses GitHub Actions for building and deploying.
# See .github/workflows/deploy-netlify.yml for the build pipeline.
# Netlify's build command is disabled because GitHub Actions handles it.

[build]
  # Build handled by GitHub Actions - skip Netlify build
  command = "echo 'Build is handled by GitHub Actions' && ls -la"
  
  # Directory with the built Flutter web app (deployed by GitHub Actions)
  publish = "build/web"
  
  # Environment variables are set in GitHub Secrets, not here
  # SUPABASE_URL - Set in GitHub repository secrets
  # SUPABASE_ANON_KEY - Set in GitHub repository secrets

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
